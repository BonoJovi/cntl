[package]
name = "cntl"
version = "0.2.0"
edition = "2024"

[dependencies]
# CLI: 宣言的にサブコマンドを定義するため derive 機能を有効化
clap = { version = "4", features = ["derive"] }

# ハッシュ: blake3 は SHA-256 より高速で暗号学的にも安全
blake3 = "1"

# シリアライゼーション: postcard (仕様化された安定ワイヤーフォーマット) + serde
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# SQLite: bundled で SQLite 本体を同梱 (システム依存を減らす)
rusqlite = { version = "0.32", features = ["bundled"] }

# クロスプラットフォームの標準パス取得 (XDG / macOS / Windows)
directories = "6"

# 作業ツリーのファイルシステム走査
walkdir = "2"

# 日時 (UTC 保存、表示時にローカル TZ へ変換)
chrono = "0.4"

# アプリケーション層のエラーハンドリング
anyhow = "1"

# unified diff 生成 (Myers アルゴリズム)
similar = "2"
